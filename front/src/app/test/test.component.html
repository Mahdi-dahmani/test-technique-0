<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Upload </title>
  
  
</head>
<body>

  <div class="container">
    <h1>Upload File </h1>
    <input type="file" (change)="onFileSelected($event)" />
    <div *ngIf="result !== null">
      <h2>Result: {{ result }}</h2>
    </div>
  </div>
</body>
</html>
